[project]
name = "cryptia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ri498", email = "ricdambus@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
